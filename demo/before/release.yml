# DISPLAY ONLY: cache-enabled reference, not evidence of an exploit.
name: Release (before)
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm test
      - run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes "Release"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v3" -f sha="$GITHUB_SHA" -F force=true
        env:
          GH_TOKEN: ${{ github.token }}
