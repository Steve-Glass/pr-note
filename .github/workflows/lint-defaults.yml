name: Lint secure defaults (same configuration)
on:
  pull_request_target:
    branches: [main]
permissions: {}

jobs:
  checkout-protection:
    name: Fork-head checkout protection
    runs-on: ubuntu-latest
    steps:
      # Same trigger/ref as the original model; never execute the checkout result.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

  cache-default:
    name: Independent read-only cache default
    # No needs: this checkpoint still runs when checkout fails. No cache-mode override.
    runs-on: ubuntu-latest
    steps:
      - name: Prepare disposable trusted text
        run: |
          mkdir -p "$RUNNER_TEMP/universe-cache-probe"
          printf 'Harmless cache-default probe.\n' > "$RUNNER_TEMP/universe-cache-probe/note.txt"
      - name: Attempt cache save under platform default
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/universe-cache-probe
          key: universe-tru1556m-default-${{ github.run_id }}-${{ github.run_attempt }}
